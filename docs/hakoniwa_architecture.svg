<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <title>sonar_radar Hakoniwa アーキテクチャ図</title>
  <defs>
    <marker id="arrB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#2980b9"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#27ae60"/>
    </marker>
    <marker id="arrY" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#b7770d"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#ffffff"/>

  <!-- Viewer プロセス（Hakoniwa 外・左端） -->
  <rect x="10" y="40" width="110" height="200" rx="5" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="65" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="#7d6608">Viewer</text>
  <text x="65" y="75" text-anchor="middle" font-size="9" fill="#7d6608">sonar_radar</text>
  <text x="65" y="87" text-anchor="middle" font-size="9" fill="#7d6608">_viewer.py</text>
  <text x="65" y="103" text-anchor="middle" font-size="9" fill="#7d6608">(mjpython)</text>
  <text x="65" y="120" text-anchor="middle" font-size="9" fill="#7d6608">MuJoCo 表示専用</text>
  <text x="65" y="145" text-anchor="middle" font-size="9" fill="#7d6608">Space キー</text>
  <text x="65" y="157" text-anchor="middle" font-size="9" fill="#7d6608">→ press_req 書込</text>
  <text x="14" y="255" font-size="8" fill="#a04000">※ Hakoniwa 外</text>

  <!-- Hakoniwa 外枠 -->
  <rect x="135" y="10" width="640" height="485" rx="6" fill="#f8f9fa" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="143" y="26" font-size="12" font-weight="bold" fill="#555">Hakoniwa フレームワーク</text>

  <!-- Asset 1: sonar_radar_hako.py -->
  <rect x="150" y="35" width="250" height="440" rx="5" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="275" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5276">Asset 1 (Plant)</text>
  <text x="275" y="70" text-anchor="middle" font-size="10" fill="#1a5276">sonar_radar_hako.py</text>

  <!-- MuJoCo 物理エンジン -->
  <rect x="165" y="80" width="220" height="80" rx="4" fill="#d4e6f1" stroke="#2980b9" stroke-width="1"/>
  <text x="275" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">MuJoCo 物理エンジン</text>
  <text x="275" y="113" text-anchor="middle" font-size="10" fill="#1a5276">motor / force sensor</text>
  <text x="275" y="127" text-anchor="middle" font-size="10" fill="#1a5276">color sensor / distance sensor</text>
  <text x="275" y="141" text-anchor="middle" font-size="10" fill="#1a5276">turret_torque actuator</text>

  <!-- on_simulation_step -->
  <rect x="165" y="175" width="220" height="110" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="275" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">on_simulation_step</text>
  <text x="275" y="210" text-anchor="middle" font-size="10" fill="#1a5276">センサー読取 → PDU 書込</text>
  <text x="175" y="228" font-size="9" fill="#1a5276"> CH0: range_sensor</text>
  <text x="175" y="242" font-size="9" fill="#1a5276"> CH1: color_rgba</text>
  <text x="175" y="256" font-size="9" fill="#1a5276"> CH3: motor_angle</text>
  <text x="175" y="270" font-size="9" fill="#1a5276"> CH4: force_sensor (Bool)</text>

  <!-- torque read -->
  <rect x="165" y="300" width="220" height="50" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="275" y="319" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">PDU 読取 → アクチュエーター制御</text>
  <text x="275" y="337" text-anchor="middle" font-size="9" fill="#1a5276">CH2: turret_torque → set_ctrl</text>

  <!-- press_req IPC -->
  <rect x="165" y="365" width="220" height="50" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="275" y="383" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a5276">ファイル IPC (press_req)</text>
  <text x="275" y="399" text-anchor="middle" font-size="9" fill="#1a5276">/tmp/sonar_radar_press_req</text>
  <text x="275" y="413" text-anchor="middle" font-size="9" fill="#1a5276">→ press_ctrl 150フレーム</text>

  <!-- qpos file -->
  <rect x="165" y="428" width="220" height="30" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="275" y="447" text-anchor="middle" font-size="9" fill="#1a5276">qpos → /tmp/sonar_radar_qpos.bin</text>

  <!-- Asset 2: sonar_radar_ctrl_hako.py -->
  <rect x="430" y="35" width="330" height="260" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="595" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">Asset 2 (Controller)</text>
  <text x="595" y="70" text-anchor="middle" font-size="10" fill="#1e8449">sonar_radar_ctrl_hako.py</text>

  <!-- HakoSpikeHat -->
  <rect x="445" y="80" width="300" height="80" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8449">HakoSpikeHat (libspikehat_hako)</text>
  <text x="595" y="113" text-anchor="middle" font-size="10" fill="#1e8449">PDU 読取・書込 ラッパー</text>
  <text x="595" y="128" text-anchor="middle" font-size="10" fill="#1e8449">hat.sleep() → hakopy.usleep()</text>
  <text x="595" y="142" text-anchor="middle" font-size="10" fill="#1e8449">auto-press スケジュール</text>

  <!-- SonarRadarSM -->
  <rect x="445" y="175" width="300" height="60" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="197" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8449">SonarRadarSM (sonar_radar.py)</text>
  <text x="595" y="215" text-anchor="middle" font-size="10" fill="#1e8449">sm.tick(hat) × SAMPLE_INTERVAL</text>
  <text x="595" y="229" text-anchor="middle" font-size="10" fill="#1e8449">on_manual_timing_control 内</text>

  <!-- PDU write -->
  <rect x="445" y="250" width="300" height="35" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8449">PDU 書込</text>
  <text x="595" y="280" text-anchor="middle" font-size="9" fill="#1e8449">CH2: turret_torque</text>

  <!-- PDU 矢印: CH0,1,3,4 → Asset2 -->
  <line x1="400" y1="225" x2="445" y2="225" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text x="422" y="219" text-anchor="middle" font-size="8" fill="#1a5276">CH0,1</text>
  <text x="422" y="231" text-anchor="middle" font-size="8" fill="#1a5276">3,4</text>

  <!-- PDU 矢印: CH2 → Asset1 -->
  <line x1="445" y1="268" x2="400" y2="268" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="422" y="262" text-anchor="middle" font-size="8" fill="#1e8449">CH2</text>

  <!-- qpos.bin: Asset1 左端(x=150) y=443 → Viewer 右端(x=120) y=155 -->
  <!-- 左に折れる経路: Asset1左端 → 左に出て → Viewer右へ -->
  <polyline points="150,443 125,443 125,155 120,155"
    fill="none" stroke="#b7770d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrY)"/>
  <text x="128" y="310" text-anchor="start" font-size="8" fill="#7d6608">qpos.bin</text>

  <!-- press_req: Viewer 右端(x=120) y=180 → Asset1 左端(x=150) y=390 -->
  <polyline points="120,180 140,180 140,390 150,390"
    fill="none" stroke="#b7770d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrY)"/>
  <text x="143" y="288" text-anchor="start" font-size="8" fill="#7d6608">press_req</text>
</svg>

<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <title>SonarRadarSM ステートマシン図</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#ffffff"/>

  <!-- 初期擬似状態 -->
  <circle cx="300" cy="28" r="10" fill="#333"/>

  <!-- INIT -->
  <rect x="230" y="55" width="140" height="38" rx="18" fill="#f0f0f0" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="79" text-anchor="middle" font-weight="bold" fill="#111111">INIT</text>

  <!-- CALIB_TO_ZERO -->
  <rect x="180" y="123" width="240" height="38" rx="18" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="300" y="147" text-anchor="middle" font-weight="bold" fill="#1a5276">CALIB_TO_ZERO</text>

  <!-- CALIB_TO_OFFSET -->
  <rect x="170" y="195" width="260" height="38" rx="18" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="300" y="219" text-anchor="middle" font-weight="bold" fill="#1a5276">CALIB_TO_OFFSET</text>

  <!-- WAIT_FOR_START -->
  <rect x="170" y="267" width="260" height="38" rx="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="300" y="291" text-anchor="middle" font-weight="bold" fill="#1e8449">WAIT_FOR_START</text>

  <!-- SCANNING -->
  <rect x="200" y="339" width="200" height="38" rx="18" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="300" y="363" text-anchor="middle" font-weight="bold" fill="#6c3483">SCANNING</text>

  <!-- RETURN_TO_ORIGIN -->
  <rect x="155" y="411" width="290" height="38" rx="18" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="300" y="435" text-anchor="middle" font-weight="bold" fill="#7d6608">RETURN_TO_ORIGIN</text>

  <!-- TERMINATED -->
  <rect x="220" y="483" width="160" height="28" rx="14" fill="#555555" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="501" text-anchor="middle" font-weight="bold" fill="#ffffff">TERMINATED</text>

  <!-- 初期 → INIT -->
  <line x1="300" y1="38" x2="300" y2="53" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- INIT → CALIB_TO_ZERO -->
  <line x1="300" y1="93" x2="300" y2="121" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CALIB_TO_ZERO → CALIB_TO_OFFSET -->
  <line x1="300" y1="161" x2="300" y2="193" stroke="#5b9bd5" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="163" width="155" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="382" y="175" text-anchor="middle" font-size="10" fill="#1a5276">モーターが0位置に到達</text>

  <!-- CALIB_TO_OFFSET → WAIT_FOR_START -->
  <line x1="300" y1="233" x2="300" y2="265" stroke="#5b9bd5" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="236" width="175" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="392" y="248" text-anchor="middle" font-size="10" fill="#1a5276">モーターがoffset位置に到達</text>

  <!-- WAIT_FOR_START → SCANNING -->
  <line x1="300" y1="305" x2="300" y2="337" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="308" width="155" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="382" y="320" text-anchor="middle" font-size="10" fill="#1e8449">フォースセンサー クリック</text>

  <!-- SCANNING → RETURN_TO_ORIGIN -->
  <line x1="300" y1="377" x2="300" y2="409" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="380" width="155" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="382" y="392" text-anchor="middle" font-size="10" fill="#6c3483">フォースセンサー クリック</text>

  <!-- RETURN_TO_ORIGIN → TERMINATED -->
  <line x1="300" y1="449" x2="300" y2="481" stroke="#d4ac0d" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="305" y="452" width="155" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="382" y="464" text-anchor="middle" font-size="10" fill="#7d6608">モーターがzero_posに到達</text>

  <!-- WAIT_FOR_START 自己ループ -->
  <path d="M170,277 C100,277 100,295 170,295" stroke="#27ae60" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="88" y="283" text-anchor="middle" font-size="10" fill="#1e8449">未押下</text>
  <text x="88" y="295" text-anchor="middle" font-size="10" fill="#1e8449">/ 押下中</text>

  <!-- SCANNING 自己ループ -->
  <path d="M200,349 C130,349 130,367 200,367" stroke="#8e44ad" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="105" y="362" text-anchor="middle" font-size="10" fill="#6c3483">スキャン中</text>
</svg>
